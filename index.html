<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan de pago</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #ffffff;
    color: #172b4d;
}

/* =========================
   ENCABEZADO
========================= */

.header {
    height: 125px;
    background: #2d3868;
    position: relative;

    display: flex;
    align-items: center;

    padding-left: 24px;
}

.logo {
    width: 84px;
    height: 84px;

    background: #8b8b8b;

    border-radius: 3px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* LOGO PROVISIONAL */

.logo-circle {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #00503d;

    position: relative;
}

.logo-circle::before {
    content: "";

    position: absolute;

    width: 25px;
    height: 12px;

    background: #a67c36;

    bottom: 2px;
    left: 15px;

    border-radius: 50%;
}

.company {
    margin-left: 24px;
}

.company-name {
    color: #b9a46a;

    font-size: 17px;

    margin-bottom: 8px;
}

.company-phone {
    color: white;

    font-size: 16px;
}

.company-phone strong {
    color: #b9a46a;
}

/* BOTÓN X */

.close {
    position: absolute;

    right: 19px;
    bottom: 13px;

    width: 29px;
    height: 29px;

    border-radius: 50%;

    border: none;

    background: white;

    color: #26345e;

    font-size: 21px;

    cursor: pointer;
}

/* =========================
   CONTENIDO
========================= */

.container {
    background: white;

    border-radius: 18px 18px 0 0;

    margin-top: -1px;

    padding: 18px 13px 30px;

    min-height: 500px;
}

.title {
    font-size: 16px;

    font-weight: bold;

    color: #333;

    margin-bottom: 17px;
}

/* =========================
   SELECCIONAR TODO
========================= */

.select-all {
    display: flex;

    align-items: center;

    gap: 11px;

    font-size: 12px;

    color: #2856c7;

    margin-bottom: 12px;
}

input[type="checkbox"] {
    width: 16px;
    height: 16px;

    accent-color: #2b59c3;

    cursor: pointer;
}

/* =========================
   CUOTA
========================= */

.installment-container {
    display: flex;

    width: 100%;

    align-items: center;
}

.installment-checkbox {
    width: 29px;

    display: flex;

    justify-content: center;
}

.installment {
    flex: 1;

    min-height: 128px;

    position: relative;

    background: white;

    border-radius: 14px;

    padding: 38px 7px 10px;

    box-shadow:
        0 4px 18px rgba(40,67,120,.10);
}

/* 3/3 */

.installment-number {
    position: absolute;

    top: 0;
    left: 0;

    width: 49px;
    height: 25px;

    border-radius: 0 0 17px 0;

    background: #b9eee9;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #008f91;

    font-size: 14px;

    font-weight: bold;
}

/* VENCE HOY */

.due {
    position: absolute;

    right: 16px;
    top: 10px;

    font-size: 14px;

    color: #333;
}

.due .red {
    color: red;

    font-weight: bold;
}

/* FILAS */

.payment-row {
    height: 44px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px dashed #c7c7c7;
}

.payment-row:last-child {
    border-bottom: none;
}

.description {
    font-size: 13px;

    color: #19315c;
}

.description .red {
    color: red;

    font-weight: bold;
}

.amount {
    font-size: 14px;

    font-weight: bold;

    color: #172b4d;
}

.date {
    font-size: 14px;

    font-weight: bold;

    color: #172b4d;
}

/* =========================
   MÉTODOS DE PAGO
========================= */

.payment-box {
    margin-top: 19px;

    padding: 8px 10px 0;

    background: white;

    border-radius: 13px;

    box-shadow:
        0 4px 18px rgba(40,67,120,.10);
}

.payment-method {
    height: 63px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid #ccc;
}

.payment-method:last-child {
    border-bottom: none;
}

.method-name {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #172b4d;

    font-size: 13px;

    font-weight: bold;
}

.icon {
    color: #064bb9;

    font-size: 18px;
}

/* BOTÓN */

.pay {
    width: 111px;
    height: 40px;

    border: none;

    border-radius: 8px;

    background: #2859c9;

    color: white;

    font-size: 12px;

    cursor: pointer;

    transition: .2s;
}

.pay:hover {
    background: #1d49ac;
}

.pay:active {
    transform: scale(.96);
}

/* =========================
   MENSAJE
========================= */

.notification {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: #ffffff;

    padding: 13px 20px;

    border-radius: 8px;

    box-shadow: 0 5px 20px rgba(0,0,0,.18);

    font-size: 14px;

    color: #172b4d;

    display: none;

    z-index: 1000;
}

/* =========================
   PANTALLA DE CARGA
========================= */

.loading-screen {
    position: fixed;

    inset: 0;

    background: white;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    z-index: 2000;
}

.spinner {
    width: 42px;
    height: 42px;

    border: 4px solid #ddd;

    border-top: 4px solid #2859c9;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin-bottom: 18px;
}

.loading-text {
    color: #26385f;

    font-size: 15px;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px) {

    .header {
        height: 110px;

        padding-left: 15px;
    }

    .logo {
        width: 70px;
        height: 70px;
    }

    .company {
        margin-left: 15px;
    }

    .company-name {
        font-size: 15px;
    }

    .company-phone {
        font-size: 14px;
    }

    .container {
        padding: 16px 10px;
    }

    .installment {
        min-height: 140px;
    }

    .due {
        right: 10px;

        font-size: 12px;
    }

    .description {
        font-size: 12px;
    }

    .amount,
    .date {
        font-size: 13px;
    }

    .method-name {
        font-size: 12px;
    }

    .pay {
        width: 100px;
    }

}

@media(max-width:400px) {

    .header {
        height: 100px;
    }

    .logo {
        width: 62px;
        height: 62px;
    }

    .company {
        margin-left: 12px;
    }

    .company-name {
        font-size: 14px;
    }

    .company-phone {
        font-size: 13px;
    }

    .payment-row {
        height: 47px;
    }

    .description {
        font-size: 11px;
    }

    .due {
        font-size: 11px;
    }

    .pay {
        width: 90px;

        font-size: 11px;
    }

}

</style>
</head>

<body>

<!-- =========================
     ENCABEZADO
========================= -->

<header class="header">

    <div class="logo">

        <div class="logo-circle"></div>

    </div>

    <div class="company">

        <div class="company-name">
            DineroAlInstante
        </div>

        <div class="company-phone">
            +593 <strong>994****19</strong>
        </div>

    </div>

    <button class="close" onclick="cerrar()">
        ×
    </button>

</header>


<!-- =========================
     CONTENIDO
========================= -->

<main class="container">

    <h2 class="title">
        Plan de pago en cuotas
    </h2>


    <!-- SELECCIONAR TODO -->

    <label class="select-all">

        <input
            type="checkbox"
            id="selectAll"
            checked
            onchange="selectAll()"
        >

        <span>
            Haga clic en seleccionar todo, se puede pagar el monto total
        </span>

    </label>


    <!-- =========================
         CUOTA
    ========================= -->

    <div class="installment-container">

        <div class="installment-checkbox">

            <input
                type="checkbox"
                class="quota"
                checked
                onchange="checkQuota()"
            >

        </div>


        <div class="installment">

            <div class="installment-number">
                3/3
            </div>


            <div class="due">

                <span class="red">
                    Hoy
                </span>

                vence la

                <span class="red">
                    3ra
                </span>

                cuota

            </div>


            <div class="payment-row">

                <div class="description">

                    Monto del pago de la

                    <span class="red">
                        3ra
                    </span>

                    cuota

                </div>

                <div class="amount">
                    $ 35
                </div>

            </div>


            <div class="payment-row">

                <div class="description">

                    Fecha de pago de la

                    <span class="red">
                        3ra
                    </span>

                    cuota

                </div>

                <div class="date">
                    28-08-2026
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         MÉTODOS DE PAGO
    ========================= -->

    <div class="payment-box">


        <!-- PAYVALIDA -->

        <div class="payment-method">

            <div class="method-name">

                <span class="icon">
                    ▣
                </span>

                <span>
                    Pagar con Payválida
                </span>

            </div>

            <button
                class="pay"
                onclick="pagar('Payválida')"
            >
                Pagar $ 35
            </button>

        </div>
  

    </div>

</main>


<!-- NOTIFICACIÓN -->

<div
    class="notification"
    id="notification"
></div>


<!-- PANTALLA DE CARGA -->

<div
    class="loading-screen"
    id="loading"
>

    <div class="spinner"></div>

    <div class="loading-text">
        Procesando pago...
    </div>

</div>


<script>

/* =========================
   SELECCIONAR TODO
========================= */

function selectAll() {

    const principal =
        document.getElementById("selectAll");

    const cuotas =
        document.querySelectorAll(".quota");

    cuotas.forEach(function(cuota) {

        cuota.checked = principal.checked;

    });

}


/* =========================
   CHECK CUOTA
========================= */

function checkQuota() {

    const cuotas =
        document.querySelectorAll(".quota");

    const seleccionadas =
        document.querySelectorAll(".quota:checked");

    document.getElementById("selectAll").checked =
        cuotas.length === seleccionadas.length;

}


/* =========================
   PAGAR
========================= */

function pagar(metodo) {

    const cuota =
        document.querySelector(".quota");

    if (!cuota.checked) {

        mostrarMensaje(
            "Seleccione la cuota que desea pagar"
        );

        return;
    }


    /*
       Aquí empieza la simulación
       del proceso de pago.
    */

    document.getElementById("loading")
        .style.display = "flex";


    setTimeout(function() {

        document.getElementById("loading")
            .style.display = "none";


        mostrarMensaje(
            "Método seleccionado: " + metodo
        );

    }, 1800);

}


/* =========================
   NOTIFICACIÓN
========================= */

function mostrarMensaje(texto) {

    const notification =
        document.getElementById("notification");

    notification.innerText = texto;

    notification.style.display = "block";


    setTimeout(function() {

        notification.style.display = "none";

    }, 2500);

}


/* =========================
   CERRAR
========================= */

function cerrar() {

    mostrarMensaje(
        "Ventana cerrada"
    );

}

</script>

</body>
</html>
